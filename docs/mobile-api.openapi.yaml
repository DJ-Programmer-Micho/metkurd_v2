        language:
          type: string
          default: ar
        split:
          type: boolean
          default: true
        max_words:
          type: integer
          minimum: 5
          maximum: 80
          default: 25
        fade_ms:
          type: integer
          minimum: 0
          maximum: 1000
          default: 80
        temperature:
          type: number
          minimum: 0
          maximum: 2.5
          default: 0.65
        top_k:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
        top_p:
          type: number
          minimum: 0
          maximum: 1
