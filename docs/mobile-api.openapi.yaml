openapi: 3.0.3
info:
  title: METKURD Mobile API
  version: 1.1.0
  description: |
    Mobile API for the six METKURD FlutterFlow apps.
    Authentication uses Laravel Sanctum bearer tokens.
    Payments and advanced website-only account management are intentionally excluded.
servers:
  - url: https://example.com
    description: Replace with your real domain
tags:
  - name: Authentication
  - name: Session
  - name: Account
  - name: Voices
  - name: Jobs
  - name: Files
paths:
  /api/mobile/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      operationId: mobileAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '403':
          $ref: '#/components/responses/Message403'
        '422':
          $ref: '#/components/responses/Validation422'
        '423':
          $ref: '#/components/responses/Message423'
        '429':
          $ref: '#/components/responses/Message429'
  /api/mobile/auth/social/{provider}:
    post:
      tags: [Authentication]
      summary: Sign in with Google or GitHub mobile token
      operationId: mobileAuthSocialLogin
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '403':
          $ref: '#/components/responses/Message403'
        '422':
          $ref: '#/components/responses/Message422'
        '423':
          $ref: '#/components/responses/Message423'
        '429':
          $ref: '#/components/responses/Message429'
  /api/mobile/auth/me:
    get:
      tags: [Session]
      summary: Get the current mobile user
      operationId: mobileAuthMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/Message401'
  /api/mobile/auth/logout:
    post:
      tags: [Session]
      summary: Revoke the current mobile token
      operationId: mobileAuthLogout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Message401'
  /api/mobile/auth/apps:
    get:
      tags: [Session]
      summary: List accessible mobile apps for the current customer
      operationId: mobileAuthApps
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Accessible app list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsResponse'
        '401':
          $ref: '#/components/responses/Message401'
  /api/mobile/account/usage:
    get:
      tags: [Account]
      summary: Get account credits, storage, and pricing metadata
      operationId: mobileAccountUsageShow
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUsageResponse'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '423':
          $ref: '#/components/responses/Message423'
  /api/mobile/tts/voices:
    get:
      tags: [Voices]
      summary: List entitled XTTS and F5TTS voices
      operationId: mobileTtsVoicesIndex
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TtsVoiceToolCode'
      responses:
        '200':
          description: Voice list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TtsVoiceListResponse'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '422':
          $ref: '#/components/responses/Validation422'
  /api/mobile/tts/voices/{speakerId}/avatar:
    get:
      tags: [Voices]
      summary: Get a protected TTS voice avatar
      operationId: mobileTtsVoiceAvatarShow
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      responses:
        '200':
          description: Binary image response for the requested voice avatar
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '404':
          $ref: '#/components/responses/Message404'
  /api/mobile/{app}/jobs:
    get:
      tags: [Jobs]
      summary: List jobs for one mobile app
      operationId: mobileJobsIndex
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppSlug'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCollection'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
  /api/mobile/{app}/jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Get one job in an app scope
      operationId: mobileJobsShow
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppSlug'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEnvelope'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '404':
          $ref: '#/components/responses/Message404'
  /api/mobile/tts/jobs:
    post:
      tags: [Jobs]
      summary: Create an XTTS or F5TTS job
      operationId: mobileTtsJobsStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TtsXttsRequest'
                - $ref: '#/components/schemas/TtsF5Request'
      responses:
        '201':
          $ref: '#/components/responses/JobCreated201'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '409':
          $ref: '#/components/responses/Message409'
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/Message429'
  /api/mobile/ctts/jobs:
    post:
      tags: [Jobs]
      summary: Create a Clone XTTS job
      operationId: mobileCttsJobsStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CttsJobRequest'
      responses:
        '201':
          $ref: '#/components/responses/JobCreated201'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '409':
          $ref: '#/components/responses/Message409'
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/Message429'
  /api/mobile/asr/jobs:
    post:
      tags: [Jobs]
      summary: Create a WASR or QASR transcription job
      operationId: mobileAsrJobsStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AsrWasrRequest'
                - $ref: '#/components/schemas/AsrQasrRequest'
      responses:
        '201':
          $ref: '#/components/responses/JobCreated201'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '409':
          $ref: '#/components/responses/Message409'
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/Message429'
  /api/mobile/stem/jobs:
    post:
      tags: [Jobs]
      summary: Create a STEM separation job
      operationId: mobileStemJobsStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StemJobRequest'
      responses:
        '201':
          $ref: '#/components/responses/JobCreated201'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '409':
          $ref: '#/components/responses/Message409'
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/Message429'
  /api/mobile/ocr/jobs:
    post:
      tags: [Jobs]
      summary: Create an OCR job
      operationId: mobileOcrJobsStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OcrJobRequest'
      responses:
        '201':
          $ref: '#/components/responses/JobCreated201'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '409':
          $ref: '#/components/responses/Message409'
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/Message429'
  /api/mobile/tran/jobs:
    post:
      tags: [Jobs]
      summary: Create a translation job
      operationId: mobileTranJobsStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranJobRequest'
      responses:
        '201':
          $ref: '#/components/responses/JobCreated201'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '409':
          $ref: '#/components/responses/Message409'
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/Message429'
  /api/mobile/{app}/files:
    get:
      tags: [Files]
      summary: List files for one mobile app
      operationId: mobileFilesIndex
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppSlug'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileCollection'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
  /api/mobile/{app}/files/upload:
    post:
      tags: [Files]
      summary: Upload an app-scoped file when uploads are enabled
      operationId: mobileFilesStore
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '401':
          $ref: '#/components/responses/Message401'
        '403':
          $ref: '#/components/responses/Message403'
        '405':
          $ref: '#/components/responses/Message405'
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/Message429'
  /api/mobile/{app}/files/{fileId}:
    get:
      tags: [Files]
      summary: Get one file in an app scope
      operationId: mobileFilesShow
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppSlug'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEnvelope'
        '401':
          $ref: '#/components/responses/Message401'
        '404':
          $ref: '#/components/responses/Message404'
  /api/mobile/{app}/files/{fileId}/download:
    get:
      tags: [Files]
      summary: Create a temporary download URL for one file
      operationId: mobileFilesDownload
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppSlug'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Temporary signed download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadResponse'
        '401':
          $ref: '#/components/responses/Message401'
        '404':
          $ref: '#/components/responses/Message404'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumToken
  parameters:
    AppSlug:
      name: app
      in: path
      required: true
      schema:
        type: string
        enum: [tts, ctts, asr, stem, ocr, tran]
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, github]
    JobId:
      name: jobId
      in: path
      required: true
      description: UUID string from ml_jobs.id
      schema:
        type: string
        format: uuid
    SpeakerId:
      name: speakerId
      in: path
      required: true
      description: Exact voice code returned by GET /api/mobile/tts/voices
      schema:
        type: string
    FileId:
      name: fileId
      in: path
      required: true
      description: Numeric integer from customer_files.id
      schema:
        type: integer
    TtsVoiceToolCode:
      name: tool_code
      in: query
      required: false
      description: Filter voices to one TTS engine
      schema:
        type: string
        enum: [tts, ftts]
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 15
  responses:
    Message401:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Message403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Message404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Message405:
      description: Method not allowed for this app
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Message409:
      description: Conflict or quota restriction
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Message422:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Message423:
      description: Locked account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Message429:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Validation422:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    JobCreated201:
      description: Job created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobSubmissionResponse'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_name:
          type: string
          maxLength: 120
        app_slug:
          type: string
          enum: [tts, ctts, asr, stem, ocr, tran]
    SocialLoginRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
        device_name:
          type: string
          maxLength: 120
        app_slug:
          type: string
          enum: [tts, ctts, asr, stem, ocr, tran]
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    LoginResponse:
      type: object
      properties:
        token_type:
          type: string
          example: Bearer
        token:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        abilities:
          type: array
          items:
            type: string
        user:
          $ref: '#/components/schemas/CurrentUser'
      required: [token_type, token, abilities, user]
    CurrentUserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
        verification_complete:
          type: boolean
        service_plan:
          $ref: '#/components/schemas/ServicePlan'
        storage:
          $ref: '#/components/schemas/StorageState'
        accessible_apps:
          type: array
          items:
            $ref: '#/components/schemas/AppDefinition'
        token:
          $ref: '#/components/schemas/TokenMeta'
    ServicePlan:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        is_paid:
          type: boolean
    StorageState:
      type: object
      properties:
        quota_mb:
          type: integer
        used_bytes:
          type: integer
        over_quota:
          type: boolean
        upload_blocked:
          type: boolean
    TokenMeta:
      type: object
      properties:
        abilities:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
    AppsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppDefinition'
    AppDefinition:
      type: object
      properties:
        slug:
          type: string
          enum: [tts, ctts, asr, stem, ocr, tran]
        name:
          type: string
        tool_codes:
          type: array
          items:
            type: string
        job_submission_enabled:
          type: boolean
        upload_enabled:
          type: boolean
    AccountUsageResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AccountUsage'
    AccountUsage:
      type: object
      properties:
        credits:
          $ref: '#/components/schemas/AccountCreditSummary'
        storage:
          $ref: '#/components/schemas/AccountStorageSummary'
        pricing:
          $ref: '#/components/schemas/AccountPricingSummary'
        meta:
          $ref: '#/components/schemas/AccountUsageMeta'
    AccountCreditSummary:
      type: object
      properties:
        balance:
          type: integer
        monthly:
          type: integer
          nullable: true
        used:
          type: integer
          nullable: true
        percent_used:
          type: integer
          nullable: true
        percent_remaining:
          type: integer
          nullable: true
    AccountStorageSummary:
      type: object
      properties:
        used_bytes:
          type: integer
        used_mb:
          type: integer
        quota_bytes:
          type: integer
          nullable: true
        quota_mb:
          type: integer
          nullable: true
        remaining_bytes:
          type: integer
          nullable: true
        remaining_mb:
          type: integer
          nullable: true
        percent_used:
          type: integer
          nullable: true
        percent_remaining:
          type: integer
          nullable: true
        over_quota:
          type: boolean
        upload_blocked:
          type: boolean
    AccountPricingSummary:
      type: object
      properties:
        version:
          type: string
          nullable: true
          description: Latest updated_at timestamp among the serialized DB pricing rules returned for this customer.
        currency:
          type: string
          enum: [credits]
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AccountPricingRule'
    AccountPricingRule:
      type: object
      properties:
        tool_code:
          type: string
        tool_action:
          type: string
        metric_code:
          type: string
          description: Canonical metric derived from DB pricing rules, such as chars, minutes, seconds, pages, files, or stem_outputs.
        unit_label:
          type: string
        billing_unit:
          oneOf:
            - type: integer
            - type: number
              format: float
          nullable: true
        credits_per_unit:
          oneOf:
            - type: integer
            - type: number
              format: float
          nullable: true
        min_billable_units:
          type: integer
          nullable: true
        rounding_mode:
          type: string
        rounding_step:
          oneOf:
            - type: integer
            - type: number
              format: float
          nullable: true
        client_formula_hint:
          type: string
        minimum_credits:
          type: integer
        maximum_credits:
          oneOf:
            - type: integer
            - type: number
              format: float
          nullable: true
        conditions:
          type: object
          nullable: true
          additionalProperties: true
    AccountUsageMeta:
      type: object
      properties:
        plan_code:
          type: string
        plan_name:
          type: string
    TtsVoiceListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            voices:
              type: array
              items:
                $ref: '#/components/schemas/TtsVoice'
    TtsVoice:
      type: object
      properties:
        speaker_id:
          type: string
        tool_code:
          type: string
          nullable: true
          enum: [tts, ftts]
        engine:
          type: string
          nullable: true
          enum: [xtts, ftts]
        name:
          type: string
        description:
          type: string
          nullable: true
        language_codes:
          type: array
          items:
            type: string
        gender:
          type: string
          nullable: true
        sort_order:
          type: integer
        is_featured:
          type: boolean
        avatar:
          allOf:
            - $ref: '#/components/schemas/TtsVoiceAvatar'
          nullable: true
        preview:
          $ref: '#/components/schemas/TtsVoicePreview'
    TtsVoiceAvatar:
      type: object
      properties:
        file_name:
          type: string
          nullable: true
        path:
          type: string
        url:
          type: string
    TtsVoicePreview:
      type: object
      properties:
        available:
          type: boolean
        file_id:
          type: integer
          nullable: true
        download_endpoint:
          type: string
          nullable: true
    JobSubmissionResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            job:
              $ref: '#/components/schemas/Job'
            next_actions:
              $ref: '#/components/schemas/JobNextActions'
    JobNextActions:
      type: object
      properties:
        status_url:
          type: string
        jobs_url:
